[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-text"
version = "0.2.0"
description = "Court record text extraction, deterministic and AI methods compared"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Cheng Ren" },
  { name = "Tim Thomas", email = "timthomas@berkeley.edu" },
  { name = "Aaron Culich", email = "aculich@berkeley.edu" },
]
keywords = ["eviction", "court records", "text extraction", "civil justice"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Science/Research",
]

# Two runtime dependencies: pydantic for the field contract, Pillow for TIFF
# frames and page rendering. PDFs and OCR go through the poppler and
# tesseract system programs (see `extract-text doctor`). The local AI backend
# uses the standard library; the Anthropic SDK is only needed for the cloud
# API backend, which is optional by design.
dependencies = ["pydantic>=2.7", "pillow>=10"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
parquet = ["pyarrow>=16"]
dev = [
  "extract-text[anthropic,parquet]",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
extract-text = "extract_text.cli:main"

[project.urls]
Repository = "https://github.com/evictionresearch/extract-text"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Correctness and import hygiene. Style-opinion rules stay off: the engine
# deliberately uses broad exception handling in the batch runner (one bad
# document must never sink a scan) and ported code keeps its source's shape,
# including the `l`-for-line idiom (E741) and small helper lambdas (E731).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741", "E731"]
