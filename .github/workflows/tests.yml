name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    # A stalled Ubuntu mirror once held this job open for the full six-hour
    # ceiling, twice over, before GitHub cancelled the run. Every job gets a
    # bound so an unreachable mirror fails in minutes instead of hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system programs (poppler, tesseract) and a test font
        # Explicit retries and per-connection timeouts: without them apt waits
        # on a dead mirror indefinitely rather than moving to the next one.
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 poppler-utils tesseract-ocr fonts-liberation
      # fonts-liberation: the tests draw made-up scans, and Liberation Sans
      # has the letter widths of the Helvetica the made-up PDFs declare
      - name: Install package
        run: pip install -e "python[dev]"
      - name: Run tests
        # The live-model test skips itself when no Ollama server is present.
        run: cd python && pytest -q
      - name: Lint
        run: cd python && ruff check src tests scripts

  pii-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the sweep reads all of git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sweep for case-number and address shapes
        run: python3 python/scripts/pii_sweep.py

  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          # This action normally bootstraps pak from r-lib's static builds,
          # which only cover the last handful of R releases. When the runner
          # image moved to R 4.6.1 that window no longer included it, and the
          # job died before touching any of our code, at `pak::repo_status()`
          # with "there is no package called 'pak'". `repo` installs pak with
          # install.packages() from the repositories configured above, so the
          # bootstrap tracks whatever R the runner has instead of r-lib's
          # build matrix. The alternative, pinning r-version, would trade this
          # breakage for no longer testing against current R.
          #
          # That outage was transient: the static build for 4.6.1 appeared
          # upstream about an hour later and the job went green on its own,
          # before this line was added. So this is insurance against the next
          # R release, not a repair. It costs a slower bootstrap, roughly ten
          # seconds, because install.packages() has to build or fetch pak
          # rather than drop in a prebuilt binary. Drop this line if that
          # trade stops being worth it.
          pak-version: repo
      - name: R CMD check
        # Engine-dependent tests skip themselves when the Python engine is
        # not installed; the check still validates structure, docs, and code.
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'

  install:
    # The install a new user runs, on machines with R and nothing else: no
    # poppler, no tesseract, and no Python set up for the package.
    # extracttext_install() has to bring all three, and a fresh R session
    # has to read a made-up scan with them. macos-14 is the version a tester
    # could not install on through Homebrew, and macos-15-intel is an Intel
    # Mac, which Homebrew no longer builds for.
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, macos-14, macos-15-intel, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          pak-version: repo
      - name: Install the R package
        run: R CMD INSTALL r
      - name: Build the engine's environment, as a new user does
        run: Rscript .github/scripts/install_check.R install
      - name: Read a made-up scan from a fresh R session
        run: Rscript .github/scripts/install_check.R use
